<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mGBA Reference Bench</title>
    <style>
      :root {
        --bg: #f4f2f7;
        --fg: #1d1b22;
        --panel: #fff;
        --line: #ddd8e6;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #16141b;
          --fg: #ece9f3;
          --panel: #211e29;
          --line: #353042;
        }
      }
      body {
        margin: 0;
        padding: 16px;
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.45 -apple-system, system-ui, sans-serif;
      }
      main {
        max-width: 520px;
        margin: 0 auto;
        display: grid;
        gap: 12px;
      }
      canvas {
        width: 100%;
        image-rendering: pixelated;
        background: #000;
      }
      pre {
        margin: 0;
        padding: 12px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        white-space: pre-wrap;
        font: 13px/1.5 ui-monospace, Menlo, monospace;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>mGBA reference bench</h1>
      <canvas id="canvas" width="240" height="160"></canvas>
      <pre id="out">loading…</pre>
    </main>
    <script type="module">
      // ?rom=<name> loads /roms/<name>.gba and /roms/<name>.sav (in-game save).
      // ?steps="N N:Start ..." (same format as tools/gba-play.ts) gets from power-on to gameplay;
      // then it walks left/right with fast-forward and counts frames per second.
      // ?shots=40,104 instead saves screenshots at those frames (for renderer diffs) and stops.
      import mGBA from '/mgba/mgba.js';
      const params = new URLSearchParams(location.search);
      const name = params.get('rom') ?? 'emerald';
      const seconds = Number(params.get('seconds') ?? 20);
      const steps = (params.get('steps') ?? '')
        .split(/\s+/)
        .filter(Boolean)
        .map((s) => {
          const [n, keys = ''] = s.split(':');
          return { n: Number(n), keys: keys.split('+').filter(Boolean) };
        });
      const out = document.getElementById('out');
      const lines = [];
      const log = (s) => {
        lines.push(s);
        out.textContent = lines.join('\n');
      };
      const Module = await mGBA({ canvas: document.getElementById('canvas') });
      await Module.FSInit();
      log(`${Module.version.projectName} ${Module.version.projectVersion}, crossOriginIsolated=${crossOriginIsolated}`);
      const paths = Module.filePaths();
      const rom = new Uint8Array(await (await fetch(`/roms/${name}.gba`)).arrayBuffer());
      Module.FS.writeFile(`${paths.gamePath}/bench.gba`, rom);
      const savRes = await fetch(`/roms/${name}.sav`);
      if (savRes.ok) Module.FS.writeFile(`${paths.savePath}/bench.sav`, new Uint8Array(await savRes.arrayBuffer()));
      log(`ROM ${name}.gba${savRes.ok ? ' + .sav' : ''}`);
      Module.setVolume(0);
      Module.setCoreSettings({ audioSync: false, videoSync: false, timestepSync: false, frameSkip: 0 });

      const shots = (params.get('shots') ?? '').split(',').filter(Boolean).map(Number);
      const shotsDone = [];
      let frame = 0;
      let held = [];
      const hold = (keys) => {
        for (const k of held) if (!keys.includes(k)) Module.buttonUnpress(k);
        for (const k of keys) if (!held.includes(k)) Module.buttonPress(k);
        held = keys;
      };
      // Script timeline in frames.
      let stepIdx = 0;
      let stepEnd = steps[0]?.n ?? 0;
      let phase = steps.length ? 'script' : 'bench';
      let benchStart = 0;
      let benchFrame0 = 0;
      const loaded = Module.loadGame(`${paths.gamePath}/bench.gba`);
      log(`loadGame: ${loaded}`);
      Module.addCoreCallbacks({
        videoFrameEndedCallback: () => {
          frame++;
          if (shots.includes(frame)) {
            Module.screenshot(`shot-${frame}.png`);
            const data = Module.FS.readFile(`${paths.screenshotsPath}/shot-${frame}.png`);
            shotsDone.push(fetch(`/__shot?name=${name}-${frame}`, { method: 'POST', body: data }));
          }
          if (phase === 'script') {
            if (frame >= stepEnd) {
              stepIdx++;
              if (stepIdx >= steps.length) {
                phase = 'bench';
                benchStart = performance.now();
                benchFrame0 = frame;
              } else stepEnd += steps[stepIdx].n;
            }
            hold(phase === 'script' ? steps[stepIdx].keys : []);
          } else {
            if (!benchStart) {
              benchStart = performance.now();
              benchFrame0 = frame;
            }
            hold([(frame - benchFrame0) % 128 < 64 ? 'Left' : 'Right']);
          }
        },
      });
      Module.setFastForwardMultiplier(Number(params.get('ff') ?? 64));
      Module.setMainLoopTiming(0, 0);

      const wait = (ms) => new Promise((r) => setTimeout(r, ms));
      if (shots.length) {
        Module.setFastForwardMultiplier(1);
        while (shotsDone.length < shots.length) await wait(100);
        await Promise.all(shotsDone);
        log(`saved ${shots.length} screenshots`);
        log(`UA: ${navigator.userAgent}`);
        Module.pauseGame();
        throw new Error('done');
      }
      while (phase === 'script') {
        await wait(250);
        out.textContent = lines.join('\n') + `\nscript frame ${frame}`;
      }
      const t0 = performance.now();
      const f0 = frame;
      await wait(seconds * 1000);
      const secs = (performance.now() - t0) / 1000;
      const n = frame - f0;
      const speed = n / secs / 59.7275;
      log(`${n} frames in ${secs.toFixed(1)} s = ${speed.toFixed(1)}x realtime (fast-forward multiplier ${Module.getFastForwardMultiplier()})`);
      log(`UA: ${navigator.userAgent}`);
      fetch('/__bench-result', {
        method: 'POST',
        body: JSON.stringify({ at: new Date().toISOString(), engine: 'mgba-wasm', rom: name, ua: navigator.userAgent, frames: n, seconds: secs, speed }),
      }).catch(() => {});
      Module.pauseGame();
    </script>
  </body>
</html>
